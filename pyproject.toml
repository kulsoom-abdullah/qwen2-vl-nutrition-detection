[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-detector"
version = "0.1.0"
description = "Fine-tuning Qwen2-VL for nutrition table detection"
authors = [
  { name = "Your Name", email = "your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.4.0",
    "torchvision>=0.19",
    "torchaudio>=2.4.0",
    "numpy",
    "pillow",
    "datasets>=2.20",
    "transformers>=4.42",
    "accelerate>=0.27",
    "trl>=0.9",
    "peft>=0.12",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "bitsandbytes>=0.43",
    "qwen-vl-utils",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
